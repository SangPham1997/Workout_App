[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node.js >= 20.19
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback: route all requests to index.html so BrowserRouter deep links work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
