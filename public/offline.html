<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ngoại tuyến — Home Workout Pro</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; max-width: 420px; padding: 2rem; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { color: #34d399; margin-bottom: 0.5rem; }
    p { color: #94a3b8; line-height: 1.6; }
    button { margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #10b981; color: #0f172a; border: none; border-radius: 0.75rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>Ứng dụng cần kết nối mạng để tải dữ liệu mới. Các bài tập đã xem trước đó vẫn có thể truy cập.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
